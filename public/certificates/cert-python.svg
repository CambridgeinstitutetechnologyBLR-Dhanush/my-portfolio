<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="100%" height="100%">
  <defs>
    <linearGradient id="certBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
  </defs>

  <!-- Border & Paper -->
  <rect width="800" height="540" fill="url(#certBg)" rx="12" stroke="#e2e8f0" stroke-width="2" />
  <rect x="24" y="24" width="752" height="492" rx="8" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 4" />
  <rect x="36" y="36" width="728" height="468" rx="6" fill="none" stroke="#0284c7" stroke-width="2" />

  <!-- Corner Flourishes -->
  <g fill="#0284c7">
    <polygon points="36,36 60,36 36,60" />
    <polygon points="764,36 740,36 764,60" />
    <polygon points="36,504 60,504 36,480" />
    <polygon points="764,504 740,504 764,480" />
  </g>

  <!-- Issuer Header -->
  <text x="400" y="90" fill="#0369a1" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" letter-spacing="4" text-anchor="middle">NXTWAVE CCBP 4.0 ACADEMY</text>
  <text x="400" y="115" fill="#64748b" font-family="-apple-system, sans-serif" font-size="12" text-anchor="middle">CERTIFICATE OF RECOGNITION &amp; ACHIEVEMENT</text>

  <!-- Divider -->
  <line x1="300" y1="135" x2="500" y2="135" stroke="#0284c7" stroke-width="2" />

  <!-- Subtitle -->
  <text x="400" y="180" fill="#475569" font-family="-apple-system, sans-serif" font-size="14" text-anchor="middle">This is to certify that</text>
  
  <!-- Recipient Name -->
  <text x="400" y="230" fill="#0f172a" font-family="-apple-system, sans-serif" font-size="32" font-weight="800" text-anchor="middle">DHANUSH KULKARNI</text>
  <line x1="220" y1="245" x2="580" y2="245" stroke="#94a3b8" stroke-width="1" />

  <!-- Certification Name -->
  <text x="400" y="285" fill="#475569" font-family="-apple-system, sans-serif" font-size="14" text-anchor="middle">has successfully completed the comprehensive certification in</text>
  <text x="400" y="325" fill="#0369a1" font-family="-apple-system, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Programming Foundations with Python</text>

  <!-- Description / Competencies -->
  <text x="400" y="365" fill="#64748b" font-family="-apple-system, sans-serif" font-size="12" text-anchor="middle">Demonstrating practical proficiency in algorithmic problem solving, core data structures,</text>
  <text x="400" y="385" fill="#64748b" font-family="-apple-system, sans-serif" font-size="12" text-anchor="middle">procedural programming logic, recursion, and modular Python development.</text>

  <!-- Badge / Seal -->
  <g transform="translate(400, 440)">
    <circle cx="0" cy="0" r="30" fill="#f0f9ff" stroke="#0284c7" stroke-width="2" />
    <text x="0" y="5" fill="#0284c7" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">VERIFIED</text>
  </g>

  <!-- Footer Signatures -->
  <g transform="translate(140, 450)">
    <line x1="0" y1="0" x2="160" y2="0" stroke="#94a3b8" stroke-width="1" />
    <text x="80" y="20" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">Program Director</text>
    <text x="80" y="34" fill="#0f172a" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">NxtWave</text>
  </g>

  <g transform="translate(500, 450)">
    <line x1="0" y1="0" x2="160" y2="0" stroke="#94a3b8" stroke-width="1" />
    <text x="80" y="20" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">Curriculum Head</text>
    <text x="80" y="34" fill="#0f172a" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">CCBP 4.0 Academy</text>
  </g>
</svg>
