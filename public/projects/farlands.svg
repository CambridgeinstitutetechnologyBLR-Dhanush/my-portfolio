<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="mcBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="blockGrass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#55a532" />
      <stop offset="100%" stop-color="#3b7a22" />
    </linearGradient>
    <linearGradient id="blockDirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#866043" />
      <stop offset="100%" stop-color="#573d2b" />
    </linearGradient>
  </defs>

  <rect width="1200" height="680" fill="url(#mcBg)" rx="16" />

  <g transform="translate(60, 50)">
    <rect width="1080" height="580" rx="12" fill="#0f172a" stroke="#4338ca" stroke-width="1" />
    
    <!-- Header -->
    <rect width="1080" height="52" rx="12" fill="#1e1b4b" />
    <circle cx="28" cy="26" r="6" fill="#ef4444" />
    <circle cx="48" cy="26" r="6" fill="#f59e0b" />
    <circle cx="68" cy="26" r="6" fill="#10b981" />

    <rect x="110" y="12" width="540" height="28" rx="6" fill="#312e81" />
    <text x="130" y="30" fill="#c7d2fe" font-family="-apple-system, sans-serif" font-size="12">https://farlands-hackathon.vercel.app</text>

    <!-- Hackathon Banner Area -->
    <g transform="translate(40, 80)">
      <!-- Pixel stylized banner -->
      <rect width="1000" height="240" rx="12" fill="#18182b" stroke="#3730a3" stroke-width="1" />
      
      <!-- Isometric Blocks decoration -->
      <g transform="translate(80, 50)">
        <!-- Pixel Block 1 -->
        <polygon points="60,10 100,30 60,50 20,30" fill="#55a532" />
        <polygon points="20,30 60,50 60,90 20,70" fill="#866043" />
        <polygon points="60,50 100,30 100,70 60,90" fill="#6d4c33" />
      </g>
      <g transform="translate(140, 80)">
        <!-- Pixel Block 2 -->
        <polygon points="60,10 100,30 60,50 20,30" fill="#4f46e5" />
        <polygon points="20,30 60,50 60,90 20,70" fill="#3730a3" />
        <polygon points="60,50 100,30 100,70 60,90" fill="#312e81" />
      </g>

      <!-- Center Typography -->
      <text x="320" y="70" fill="#a5b4fc" font-family="Courier New, monospace" font-size="14" letter-spacing="4">ANNUAL ENGINEERING HACKATHON</text>
      <text x="320" y="120" fill="#ffffff" font-family="Courier New, monospace" font-size="44" font-weight="900" letter-spacing="2">FARLANDS 2024</text>
      <text x="320" y="150" fill="#e0e7ff" font-family="-apple-system, sans-serif" font-size="16">An Immersive Minecraft-Inspired Collegiate Tech Sprint</text>
      
      <!-- Tag Pills -->
      <g transform="translate(320, 180)">
        <rect width="110" height="28" rx="4" fill="#4338ca" />
        <text x="55" y="18" fill="#ffffff" font-family="Courier New, monospace" font-size="12" font-weight="bold" text-anchor="middle">36 HOURS</text>
        
        <rect x="120" width="130" height="28" rx="4" fill="#047857" />
        <text x="185" y="18" fill="#ffffff" font-family="Courier New, monospace" font-size="12" font-weight="bold" text-anchor="middle">500+ HACKERS</text>

        <rect x="260" width="140" height="28" rx="4" fill="#b45309" />
        <text x="330" y="18" fill="#ffffff" font-family="Courier New, monospace" font-size="12" font-weight="bold" text-anchor="middle">INR 1,00,000 PRIZE</text>
      </g>
    </g>

    <!-- Schedule & Tracks Grid -->
    <g transform="translate(40, 350)">
      <!-- Track 1 -->
      <rect width="310" height="180" rx="8" fill="#18182b" stroke="#2e2b5f" stroke-width="1" />
      <text x="24" y="36" fill="#818cf8" font-family="Courier New, monospace" font-size="14" font-weight="bold">TRACK 01 // WEB3 &amp; SAAS</text>
      <text x="24" y="66" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="13">Decentralized protocols, scalable software solutions, and micro-services architectures.</text>
      <rect x="24" y="130" width="90" height="24" rx="4" fill="#312e81" />
      <text x="69" y="146" fill="#c7d2fe" font-family="Courier New, monospace" font-size="11" text-anchor="middle">EXPLORE</text>

      <!-- Track 2 -->
      <rect x="345" width="310" height="180" rx="8" fill="#18182b" stroke="#2e2b5f" stroke-width="1" />
      <text x="369" y="36" fill="#34d399" font-family="Courier New, monospace" font-size="14" font-weight="bold">TRACK 02 // AI &amp; AGENTIC</text>
      <text x="369" y="66" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="13">LLM workflows, automated agents, intelligent vision systems, and practical tools.</text>
      <rect x="369" y="130" width="90" height="24" rx="4" fill="#065f46" />
      <text x="414" y="146" fill="#a7f3d0" font-family="Courier New, monospace" font-size="11" text-anchor="middle">EXPLORE</text>

      <!-- Track 3 -->
      <rect x="690" width="310" height="180" rx="8" fill="#18182b" stroke="#2e2b5f" stroke-width="1" />
      <text x="714" y="36" fill="#fbbf24" font-family="Courier New, monospace" font-size="14" font-weight="bold">TRACK 03 // IOT &amp; SYSTEMS</text>
      <text x="714" y="66" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="13">Hardware sensors, embedded telemetry, robotics, and smart infrastructure pipelines.</text>
      <rect x="714" y="130" width="90" height="24" rx="4" fill="#78350f" />
      <text x="759" y="146" fill="#fde68a" font-family="Courier New, monospace" font-size="11" text-anchor="middle">EXPLORE</text>
    </g>
  </g>
</svg>
