<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" fill="url(#bg)" rx="16" />
  
  <!-- Subtle Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="680" />
    <line x1="280" y1="0" x2="280" y2="680" />
    <line x1="480" y1="0" x2="480" y2="680" />
    <line x1="680" y1="0" x2="680" y2="680" />
    <line x1="880" y1="0" x2="880" y2="680" />
    <line x1="1080" y1="0" x2="1080" y2="680" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="440" x2="1200" y2="440" />
    <line x1="0" y1="600" x2="1200" y2="600" />
  </g>

  <!-- Mock Browser Window Frame -->
  <g transform="translate(60, 50)">
    <!-- Browser Chrome -->
    <rect width="1080" height="580" rx="12" fill="#090d16" stroke="#334155" stroke-width="1" />
    
    <!-- Top Header Bar -->
    <rect width="1080" height="52" rx="12" fill="#0f172a" />
    <rect y="40" width="1080" height="12" fill="#0f172a" />
    <circle cx="28" cy="26" r="6" fill="#ef4444" />
    <circle cx="48" cy="26" r="6" fill="#f59e0b" />
    <circle cx="68" cy="26" r="6" fill="#10b981" />

    <!-- Address Bar -->
    <rect x="110" y="12" width="560" height="28" rx="6" fill="#1e293b" />
    <text x="130" y="30" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">https://taxoraai.vercel.app/dashboard/workflow</text>

    <!-- Status badge -->
    <rect x="940" y="14" width="100" height="24" rx="12" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-opacity="0.4" />
    <circle cx="955" cy="26" r="4" fill="#22c55e" />
    <text x="968" y="30" fill="#4ade80" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">LIVE SAAS</text>

    <!-- Sidebar -->
    <rect x="0" y="52" width="220" height="528" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
    
    <!-- App Brand -->
    <g transform="translate(24, 76)">
      <rect width="32" height="32" rx="8" fill="url(#accent)" />
      <text x="16" y="22" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">T</text>
      <text x="44" y="21" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">Taxora AI</text>
      <text x="44" y="33" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">Automated Tax Engine</text>
    </g>

    <!-- Nav Items -->
    <g transform="translate(20, 140)">
      <!-- Item Active -->
      <rect width="180" height="36" rx="6" fill="#1e293b" />
      <rect x="0" y="6" width="3" height="24" rx="1.5" fill="#3b82f6" />
      <text x="24" y="23" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Overview Dashboard</text>
      
      <!-- Inactive items -->
      <text x="24" y="63" fill="#64748b" font-family="-apple-system, sans-serif" font-size="13">Tax Calculations</text>
      <text x="24" y="103" fill="#64748b" font-family="-apple-system, sans-serif" font-size="13">Deduction Tracker</text>
      <text x="24" y="143" fill="#64748b" font-family="-apple-system, sans-serif" font-size="13">Filing Automation</text>
      <text x="24" y="183" fill="#64748b" font-family="-apple-system, sans-serif" font-size="13">Export Reports</text>
    </g>

    <!-- Main Content Area -->
    <g transform="translate(250, 75)">
      <!-- Top Title -->
      <text x="0" y="20" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="20" font-weight="700">Tax Intelligence &amp; Workflow Overview</text>
      <text x="0" y="40" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Next.js &amp; TypeScript Full-Stack Micro-SaaS Engine</text>

      <!-- Stat Cards -->
      <g transform="translate(0, 60)">
        <!-- Card 1 -->
        <rect width="240" height="90" rx="8" fill="#131c31" stroke="#1e293b" stroke-width="1" />
        <text x="18" y="28" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" font-weight="500">ESTIMATED TAX SAVINGS</text>
        <text x="18" y="60" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="24" font-weight="700">$14,820.00</text>
        <text x="18" y="78" fill="#22c55e" font-family="-apple-system, sans-serif" font-size="11">✓ Optimized via Section 80C &amp; D</text>

        <!-- Card 2 -->
        <rect x="260" width="240" height="90" rx="8" fill="#131c31" stroke="#1e293b" stroke-width="1" />
        <text x="278" y="28" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" font-weight="500">FILING READINESS</text>
        <text x="278" y="60" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="24" font-weight="700">96.4%</text>
        <text x="278" y="78" fill="#3b82f6" font-family="-apple-system, sans-serif" font-size="11">All verification checks passed</text>

        <!-- Card 3 -->
        <rect x="520" width="260" height="90" rx="8" fill="#131c31" stroke="#1e293b" stroke-width="1" />
        <text x="538" y="28" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" font-weight="500">SYSTEM ARCHITECTURE</text>
        <text x="538" y="58" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="16" font-weight="600">Next.js • Tailwind • Vercel</text>
        <text x="538" y="78" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Zero server overhead • Fast SSR</text>
      </g>

      <!-- Main Visual Chart / Interactive Mockup -->
      <g transform="translate(0, 170)">
        <rect width="780" height="240" rx="8" fill="#131c31" stroke="#1e293b" stroke-width="1" />
        <text x="20" y="32" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">Tax Computation Bracket Distribution</text>
        <text x="600" y="32" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Automated Analysis 2024</text>

        <!-- Chart Grid Lines -->
        <line x1="40" y1="70" x2="740" y2="70" stroke="#1e293b" stroke-width="1" />
        <line x1="40" y1="120" x2="740" y2="120" stroke="#1e293b" stroke-width="1" />
        <line x1="40" y1="170" x2="740" y2="170" stroke="#1e293b" stroke-width="1" />
        <line x1="40" y1="210" x2="740" y2="210" stroke="#334155" stroke-width="1" />

        <!-- Chart Bars & Trends -->
        <path d="M 60 190 Q 180 140, 280 110 T 480 80 T 680 50" fill="none" stroke="#3b82f6" stroke-width="3" />
        <circle cx="280" cy="110" r="5" fill="#38bdf8" />
        <circle cx="480" cy="80" r="5" fill="#38bdf8" />
        <circle cx="680" cy="50" r="5" fill="#38bdf8" />

        <!-- Accent Bar Graphs -->
        <rect x="80" y="130" width="30" height="80" rx="3" fill="#1e293b" />
        <rect x="160" y="110" width="30" height="100" rx="3" fill="#1e293b" />
        <rect x="240" y="90" width="30" height="120" rx="3" fill="#3b82f6" fill-opacity="0.7" />
        <rect x="320" y="70" width="30" height="140" rx="3" fill="#1e293b" />
        <rect x="400" y="100" width="30" height="110" rx="3" fill="#1e293b" />
        <rect x="480" y="60" width="30" height="150" rx="3" fill="#3b82f6" fill-opacity="0.9" />
        <rect x="560" y="80" width="30" height="130" rx="3" fill="#1e293b" />
        <rect x="640" y="50" width="30" height="160" rx="3" fill="#38bdf8" />

        <!-- Labels -->
        <text x="82" y="226" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">Jan</text>
        <text x="162" y="226" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">Mar</text>
        <text x="242" y="226" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">May</text>
        <text x="322" y="226" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">Jul</text>
        <text x="402" y="226" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">Sep</text>
        <text x="482" y="226" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">Nov</text>
        <text x="562" y="226" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">Q4</text>
        <text x="642" y="226" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">Final</text>
      </g>
    </g>
  </g>
</svg>
