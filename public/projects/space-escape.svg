<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="spaceBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#0d1127" />
      <stop offset="100%" stop-color="#181335" />
    </linearGradient>
    <radialGradient id="nebula" cx="60%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="680" fill="url(#spaceBg)" rx="16" />
  <rect width="1200" height="680" fill="url(#nebula)" rx="16" />

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="120" cy="80" r="1.5" opacity="0.8" />
    <circle cx="280" cy="140" r="1" opacity="0.5" />
    <circle cx="450" cy="60" r="2" opacity="0.9" />
    <circle cx="700" cy="110" r="1.5" opacity="0.7" />
    <circle cx="950" cy="90" r="1.2" opacity="0.6" />
    <circle cx="1100" cy="160" r="1.8" opacity="0.85" />
    <circle cx="180" cy="320" r="1" opacity="0.4" />
    <circle cx="340" cy="480" r="1.5" opacity="0.7" />
    <circle cx="620" cy="530" r="2" opacity="0.6" />
    <circle cx="880" cy="420" r="1.2" opacity="0.5" />
    <circle cx="1040" cy="560" r="1.7" opacity="0.8" />
  </g>

  <!-- Frame -->
  <g transform="translate(60, 50)">
    <rect width="1080" height="580" rx="12" fill="#090c19" stroke="#3b2d69" stroke-width="1" />

    <!-- Game HUD Header -->
    <rect width="1080" height="60" rx="12" fill="#11162b" />
    
    <!-- Title / HUD info -->
    <text x="32" y="38" fill="#e0e7ff" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" letter-spacing="1">🚀 SPACE ESCAPE RUNNER</text>
    
    <g transform="translate(620, 16)">
      <rect width="130" height="28" rx="6" fill="#1e1b4b" stroke="#4338ca" stroke-width="1" />
      <text x="14" y="19" fill="#a5b4fc" font-family="Courier New, monospace" font-size="11">SCORE: 18,450</text>

      <rect x="145" width="130" height="28" rx="6" fill="#1e1b4b" stroke="#f59e0b" stroke-width="1" />
      <text x="159" y="19" fill="#fde68a" font-family="Courier New, monospace" font-size="11">HIGH: 24,900</text>

      <rect x="290" width="130" height="28" rx="6" fill="#1e1b4b" stroke="#10b981" stroke-width="1" />
      <text x="304" y="19" fill="#6ee7b7" font-family="Courier New, monospace" font-size="11">FPS: 60.0 (SYNC)</text>
    </g>

    <!-- Canvas Game Viewport -->
    <g transform="translate(40, 85)">
      <rect width="1000" height="455" rx="8" fill="#04060e" stroke="#1e2238" stroke-width="1" />

      <!-- Speed Trails -->
      <line x1="80" y1="120" x2="380" y2="120" stroke="#6366f1" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="10 20" />
      <line x1="200" y1="230" x2="600" y2="230" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="15 30" />
      <line x1="120" y1="360" x2="520" y2="360" stroke="#818cf8" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="20 40" />

      <!-- Player Spacecraft -->
      <g transform="translate(220, 210)">
        <!-- Thruster Glow -->
        <polygon points="-30,10 -60,18 -30,26" fill="#f97316" opacity="0.9" />
        <polygon points="-30,14 -48,18 -30,22" fill="#fef08a" />
        
        <!-- Ship Hull -->
        <polygon points="50,18 -10,0 -20,18 -10,36" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5" />
        <polygon points="10,18 -15,8 -15,28" fill="#e0f2fe" />
        <polygon points="4,18 -5,12 -5,24" fill="#0369a1" />
        
        <!-- Wings -->
        <polygon points="-10,4 -30,-10 -25,4" fill="#0ea5e9" />
        <polygon points="-10,32 -30,46 -25,32" fill="#0ea5e9" />

        <!-- Shield Field -->
        <circle cx="10" cy="18" r="42" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="4 6" />
      </g>

      <!-- Laser Beams -->
      <line x1="280" y1="228" x2="480" y2="228" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
      <line x1="490" y1="228" x2="560" y2="228" stroke="#a5f3fc" stroke-width="4" stroke-linecap="round" />

      <!-- Asteroids / Obstacles -->
      <!-- Asteroid 1 -->
      <g transform="translate(680, 180)">
        <polygon points="0,-35 32,-24 45,15 20,40 -25,32 -40,-8" fill="#475569" stroke="#64748b" stroke-width="2" />
        <circle cx="10" cy="-5" r="6" fill="#334155" />
        <circle cx="-12" cy="12" r="8" fill="#334155" />
      </g>

      <!-- Asteroid 2 -->
      <g transform="translate(860, 90)">
        <polygon points="0,-25 22,-16 30,10 15,28 -18,22 -28,-6" fill="#64748b" stroke="#94a3b8" stroke-width="1.5" />
        <circle cx="5" cy="2" r="4" fill="#475569" />
      </g>

      <!-- Asteroid 3 -->
      <g transform="translate(820, 320)">
        <polygon points="0,-40 38,-28 50,20 22,45 -30,36 -45,-10" fill="#334155" stroke="#475569" stroke-width="2" />
        <circle cx="8" cy="-8" r="9" fill="#1e293b" />
        <circle cx="-16" cy="15" r="7" fill="#1e293b" />
      </g>

      <!-- Energy Orbs / Pickups -->
      <g transform="translate(560, 140)">
        <circle cx="0" cy="0" r="10" fill="#facc15" fill-opacity="0.3" />
        <circle cx="0" cy="0" r="5" fill="#fde047" />
      </g>
      <g transform="translate(480, 310)">
        <circle cx="0" cy="0" r="10" fill="#10b981" fill-opacity="0.3" />
        <circle cx="0" cy="0" r="5" fill="#34d399" />
      </g>
    </g>
  </g>
</svg>
